<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OBLIX — Archive</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    background: #050505;
    color: #f2f2f2;
    font-family: Arial, Helvetica, sans-serif;
    overflow-x: hidden;
}

header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 70px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 28px;
    z-index: 100;
    background: linear-gradient(to bottom, rgba(5,5,5,0.95), rgba(5,5,5,0));
}

.logo {
    font-size: 19px;
    letter-spacing: 7px;
    font-weight: 700;
}

.cart {
    font-size: 10px;
    letter-spacing: 3px;
    cursor: pointer;
}

.hero {
    height: 100vh;
    min-height: 650px;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
}

.hero-content {
    text-align: center;
    z-index: 10;
}

.small {
    font-size: 9px;
    letter-spacing: 6px;
    opacity: 0.45;
    margin-bottom: 22px;
}

.hero h1 {
    font-size: clamp(55px, 15vw, 150px);
    letter-spacing: -5px;
    line-height: 0.8;
    font-weight: 900;
}

.hero p {
    margin-top: 30px;
    font-size: 9px;
    letter-spacing: 5px;
    opacity: 0.45;
}

.web {
    position: absolute;
    width: 620px;
    height: 620px;
    left: -180px;
    top: 80px;
    opacity: 0.35;
    animation: webFloat 9s ease-in-out infinite;
}

.web2 {
    position: absolute;
    width: 500px;
    height: 500px;
    right: -180px;
    bottom: -100px;
    opacity: 0.3;
    animation: webFloatReverse 11s ease-in-out infinite;
}

.web::before,
.web::after,
.web2::before,
.web2::after {
    content: "";
    position: absolute;
    inset: 0;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 50%;
}

.web::after {
    inset: 90px;
}

.web2::after {
    inset: 70px;
}

.web-lines {
    position: absolute;
    inset: 0;
}

.web-lines span {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 100%;
    height: 1px;
    background: rgba(255,255,255,0.18);
    transform-origin: center;
}

.web-lines span:nth-child(1) { transform: rotate(0deg); }
.web-lines span:nth-child(2) { transform: rotate(45deg); }
.web-lines span:nth-child(3) { transform: rotate(90deg); }
.web-lines span:nth-child(4) { transform: rotate(135deg); }

@keyframes webFloat {
    0%,100% { transform: rotate(0deg) scale(1); }
    50% { transform: rotate(8deg) scale(1.05); }
}

@keyframes webFloatReverse {
    0%,100% { transform: rotate(0deg) scale(1); }
    50% { transform: rotate(-10deg) scale(1.06); }
}

.blood {
    position: absolute;
    top: 0;
    left: 50%;
    width: 2px;
    height: 100%;
    background: linear-gradient(
        to bottom,
        transparent,
        rgba(90,0,0,0.7),
        rgba(140,0,0,0.9),
        transparent
    );
    opacity: 0.8;
    animation: bloodMove 4s ease-in-out infinite;
}

.blood.one { transform: translateX(-210px); }
.blood.two {
    transform: translateX(150px);
    animation-delay: 1.2s;
}
.blood.three {
    transform: translateX(310px);
    animation-delay: 2.2s;
}

@keyframes bloodMove {
    0%,100% {
        height: 25%;
        opacity: 0.25;
    }
    50% {
        height: 75%;
        opacity: 0.8;
    }
}

.archive {
    padding: 130px 22px 100px;
    max-width: 1200px;
    margin: auto;
}

.archive-title {
    display: flex;
    justify-content: space-between;
    align-items: end;
    margin-bottom: 35px;
}

.archive-title h2 {
    font-size: 12px;
    letter-spacing: 5px;
}

.archive-title span {
    font-size: 8px;
    letter-spacing: 3px;
    opacity: 0.35;
}

.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.card {
    height: 360px;
    position: relative;
    overflow: hidden;
    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(80,80,80,0.15),
            transparent 45%
        ),
        #0a0a0a;
    border: 1px solid rgba(255,255,255,0.1);
    cursor: pointer;
    transition: 0.5s;
    display: block;
    text-decoration: none;
    color: inherit;
}

.card:hover {
    transform: scale(0.985);
    border-color: rgba(255,255,255,0.35);
}

.card-number {
    position: absolute;
    top: 18px;
    left: 18px;
    font-size: 8px;
    letter-spacing: 3px;
    opacity: 0.4;
}

.card-status {
    position: absolute;
    top: 18px;
    right: 18px;
    font-size: 7px;
    letter-spacing: 2px;
    opacity: 0.35;
}

.card-content {
    position: absolute;
    left: 22px;
    bottom: 22px;
    z-index: 5;
}

.card h3 {
    font-size: 25px;
    letter-spacing: 3px;
    margin-bottom: 10px;
}

.open {
    font-size: 8px;
    letter-spacing: 3px;
    opacity: 0.4;
}

.mini-web {
    position: absolute;
    width: 190px;
    height: 190px;
    right: -35px;
    top: 55px;
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 50%;
    animation: miniWeb 8s linear infinite;
}

.mini-web::before,
.mini-web::after {
    content: "";
    position: absolute;
    inset: 25px;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 50%;
}

.mini-web::after {
    inset: 60px;
}

@keyframes miniWeb {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

/* SPIDER */

.spider {
    position: absolute;
    width: 24px;
    height: 24px;
    z-index: 4;
    animation: spiderMove 7s linear infinite;
}

.spider-body {
    position: absolute;
    width: 8px;
    height: 11px;
    background: #050505;
    border: 1px solid rgba(255,255,255,0.65);
    border-radius: 50%;
    left: 8px;
    top: 7px;
}

.spider-body::after {
    content: "";
    position: absolute;
    width: 4px;
    height: 4px;
    background: #050505;
    border: 1px solid rgba(255,255,255,0.5);
    border-radius: 50%;
    left: 1px;
    top: -5px;
}

.leg {
    position: absolute;
    width: 10px;
    height: 1px;
    background: rgba(255,255,255,0.65);
    transform-origin: right center;
}

.l1 { left: 0; top: 7px; transform: rotate(25deg); }
.l2 { left: 0; top: 11px; transform: rotate(-20deg); }
.l3 { left: 1px; top: 15px; transform: rotate(-45deg); }
.l4 { right: 0; top: 7px; transform: rotate(-25deg); }
.l5 { right: 0; top: 11px; transform: rotate(20deg); }
.l6 { right: 1px; top: 15px; transform: rotate(45deg); }

@keyframes spiderMove {
    0% {
        left: 18%;
        top: 12%;
        transform: rotate(0deg);
    }

    25% {
        left: 78%;
        top: 18%;
        transform: rotate(90deg);
    }

    50% {
        left: 70%;
        top: 62%;
        transform: rotate(180deg);
    }

    75% {
        left: 25%;
        top: 70%;
        transform: rotate(270deg);
    }

    100% {
        left: 18%;
        top: 12%;
        transform: rotate(360deg);
    }
}

.card:nth-child(2) .spider {
    animation-duration: 9s;
    animation-delay: -2s;
}

.card:nth-child(3) .spider {
    animation-duration: 8s;
    animation-delay: -4s;
}

.card:nth-child(4) .spider {
    animation-duration: 10s;
    animation-delay: -6s;
}

.card-blood {
    position: absolute;
    width: 1px;
    height: 130px;
    background: linear-gradient(
        to bottom,
        rgba(100,0,0,0.8),
        transparent
    );
    top: 0;
    animation: cardBlood 3s ease-in-out infinite;
}

.card-blood.a { left: 30%; }

.card-blood.b {
    left: 65%;
    animation-delay: 1s;
}

@keyframes cardBlood {
    0%,100% {
        height: 30px;
        opacity: 0.2;
    }
    50% {
        height: 160px;
        opacity: 0.8;
    }
}

footer {
    padding: 35px 25px;
    border-top: 1px solid rgba(255,255,255,0.08);
    display: flex;
    justify-content: space-between;
    font-size: 7px;
    letter-spacing: 3px;
    opacity: 0.35;
}

@media (max-width: 600px) {

    header {
        padding: 0 18px;
    }

    .logo {
        font-size: 16px;
        letter-spacing: 5px;
    }

    .hero h1 {
        font-size: 70px;
    }

    .grid {
        grid-template-columns: 1fr;
    }

    .card {
        height: 330px;
    }

    .web {
        width: 450px;
        height: 450px;
        left: -250px;
    }

    .web2 {
        width: 400px;
        height: 400px;
        right: -250px;
    }
}
</style>
</head>
