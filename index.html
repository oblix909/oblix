<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OBLIX — Archive</title>

<style>
* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: #030303;
  color: #eee;
  font-family: Arial, Helvetica, sans-serif;
  overflow-x: hidden;
}

header {
  position: relative;
  z-index: 10;
  padding: 22px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #1d1d1d;
}

.logo {
  font-size: 19px;
  font-weight: bold;
  letter-spacing: 6px;
}

.cart {
  color: #777;
  font-size: 10px;
  letter-spacing: 3px;
}

.hero {
  min-height: 78vh;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 70px 24px;
}

.hero-small {
  color: #555;
  font-size: 10px;
  letter-spacing: 5px;
  margin-bottom: 22px;
}

.hero h1 {
  margin: 0;
  font-size: clamp(70px, 18vw, 190px);
  line-height: .78;
  letter-spacing: -9px;
}

.hero-sub {
  margin-top: 35px;
  color: #666;
  font-size: 10px;
  letter-spacing: 4px;
}

.web {
  position: absolute;
  width: 520px;
  height: 520px;
  border: 1px solid #181818;
  border-radius: 50%;
  right: -180px;
  top: 50%;
  transform: translateY(-50%);
  opacity: .8;
  animation: spin 18s linear infinite;
}

.web::before,
.web::after {
  content: "";
  position: absolute;
  inset: 55px;
  border: 1px solid #181818;
  border-radius: 50%;
}

.web::after {
  inset: 120px;
}

.web-line {
  position: absolute;
  left: 50%;
  top: 0;
  width: 1px;
  height: 100%;
  background: #181818;
  transform-origin: center;
}

.web-line:nth-child(1) {
  transform: rotate(30deg);
}

.web-line:nth-child(2) {
  transform: rotate(60deg);
}

.web-line:nth-child(3) {
  transform: rotate(90deg);
}

.web-line:nth-child(4) {
  transform: rotate(120deg);
}

.web-line:nth-child(5) {
  transform: rotate(150deg);
}

.blood {
  position: absolute;
  top: -30px;
  width: 2px;
  background: linear-gradient(to bottom, #560000, #170000, transparent);
  animation: drip 5s ease-in-out infinite;
}

.blood.one {
  right: 31%;
  height: 180px;
}

.blood.two {
  right: 17%;
  height: 120px;
  animation-delay: 1.7s;
}

.blood.three {
  left: 13%;
  height: 90px;
  animation-delay: 3s;
}

@keyframes spin {
  from {
    transform: translateY(-50%) rotate(0deg);
  }
  to {
    transform: translateY(-50%) rotate(360deg);
  }
}

@keyframes drip {
  0%, 100% {
    transform: scaleY(.3);
    transform-origin: top;
    opacity: .2;
  }
  50% {
    transform: scaleY(1);
    transform-origin: top;
    opacity: .8;
  }
}

.archive {
  position: relative;
  z-index: 2;
  padding: 30px 24px 90px;
  max-width: 1100px;
  margin: auto;
}

.archive-title {
  display: flex;
  justify-content: space-between;
  align-items: end;
  border-bottom: 1px solid #222;
  padding-bottom: 18px;
  margin-bottom: 14px;
}

.archive-title h2 {
  margin: 0;
  font-size: 12px;
  letter-spacing: 4px;
}

.archive-title span {
  color: #555;
  font-size: 9px;
  letter-spacing: 2px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
}

.card {
  position: relative;
  min-height: 330px;
  border: 1px solid #202020;
  background: #070707;
  overflow: hidden;
  text-decoration: none;
  color: #eee;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  transition: border-color .3s, transform .3s;
}

.card:hover {
  border-color: #555;
  transform: translateY(-3px);
}

.card-top {
  display: flex;
  justify-content: space-between;
  padding: 14px;
  color: #555;
  font-size: 8px;
  letter-spacing: 2px;
}

.card-center {
  position: relative;
  height: 150px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.card-center::before,
.card-center::after {
  content: "";
  position: absolute;
  border: 1px solid #1b1b1b;
  border-radius: 50%;
  width: 115px;
  height: 115px;
  animation: miniSpin 8s linear infinite;
}

.card-center::after {
  width: 75px;
  height: 75px;
  animation-direction: reverse;
}

@keyframes miniSpin {
  from {
    transform: rotate(0deg);
  }
  to {
    transform: rotate(360deg);
  }
}

.card-number {
  position: relative;
  z-index: 2;
  font-size: 34px;
  color: #292929;
  font-weight: bold;
}

.card-bottom {
  padding: 18px;
  border-top: 1px solid #1b1b1b;
}

.card-name {
  font-size: 21px;
  letter-spacing: 2px;
}

.card-status {
  margin-top: 8px;
  color: #555;
  font-size: 8px;
  letter-spacing: 3px;
}

footer {
  border-top: 1px solid #1c1c1c;
  padding: 28px 24px;
  color: #444;
  font-size: 9px;
  letter-spacing: 3px;
}

@media (max-width: 600px) {
  .grid {
    grid-template-columns: 1fr;
  }

  .hero {
    min-height: 70vh;
  }

  .hero h1 {
    letter-spacing: -5px;
  }

  .web {
    width: 390px;
    height: 390px;
    right: -210px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">OBLIX</div>
  <div class="cart">КОРЗИНА</div>
</header>

<section class="hero">

  <div class="hero-small">ARCHIVE / 2026</div>

  <h1>OBLIX</h1>

  <div class="hero-sub">
    RITUAL / NOCTURNE / UNKNOWN
  </div>

  <div class="web">
    <div class="web-line"></div>
    <div class="web-line"></div>
    <div class="web-line"></div>
    <div class="web-line"></div>
    <div class="web-line"></div>
  </div>

  <div class="blood one"></div>
  <div class="blood two"></div>
  <div class="blood three"></div>

</section>

<section class="archive">

  <div class="archive-title">
    <h2>ARCHIVE</h2>
    <span>SELECT FILE</span>
  </div>

  <div class="grid">

    <a class="card" href="tshirts.html">
      <div class="card-top">
        <span>ARCHIVE 001</span>
        <span>SEALED</span>
      </div>

      <div class="card-center">
        <div class="card-number">01</div>
      </div>

      <div class="card-bottom">
        <div class="card-name">T-SHIRTS</div>
        <div class="card-status">OPEN ARCHIVE →</div>
      </div>
    </a>

    <div class="card">
      <div class="card-top">
        <span>ARCHIVE 002</span>
        <span>CLASSIFIED</span>
      </div>

      <div class="card-center">
        <div class="card-number">02</div>
      </div>

      <div class="card-bottom">
        <div class="card-name">LONG SLEEVES</div>
        <div class="card-status">COMING SOON</div>
      </div>
    </div>

    <div class="card">
      <div class="card-top">
        <span>ARCHIVE 003</span>
        <span>RESTRICTED</span>
      </div>

      <div class="card-center">
        <div class="card-number">03</div>
      </div>

      <div class="card-bottom">
        <div class="card-name">JEANS</div>
        <div class="card-status">COMING SOON</div>
      </div>
    </div>

    <div class="card">
      <div class="card-top">
        <span>ARCHIVE 004</span>
        <span>UNKNOWN</span>
      </div>

      <div class="card-center">
        <div class="card-number">04</div>
      </div>

      <div class="card-bottom">
        <div class="card-name">ACCESSORIES</div>
        <div class="card-status">COMING SOON</div>
      </div>
    </div>

  </div>
</section>

<footer>
  OBLIX / ARCHIVE 2026
</footer>

</body>
</html>
