<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OBLIX — T-Shirts</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #050505;
  color: #e8e8e8;
  font-family: Arial, Helvetica, sans-serif;
}

header {
  padding: 22px 24px;
  border-bottom: 1px solid #222;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 20px;
  letter-spacing: 5px;
  font-weight: bold;
}

.back {
  color: #777;
  text-decoration: none;
  font-size: 11px;
  letter-spacing: 2px;
}

.back:hover {
  color: white;
}

.hero {
  padding: 70px 24px 50px;
  border-bottom: 1px solid #222;
}

.archive-number {
  color: #666;
  font-size: 10px;
  letter-spacing: 4px;
  margin-bottom: 15px;
}

h1 {
  margin: 0;
  font-size: clamp(48px, 12vw, 110px);
  letter-spacing: -5px;
  line-height: .85;
}

.subtitle {
  margin-top: 25px;
  color: #777;
  font-size: 11px;
  letter-spacing: 3px;
}

.products {
  padding: 30px 24px 80px;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
  max-width: 1000px;
  margin: auto;
}

.product {
  border: 1px solid #222;
  min-height: 360px;
  position: relative;
  overflow: hidden;
  background: #090909;
}

.product-image {
  height: 280px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #333;
  font-size: 10px;
  letter-spacing: 3px;
  background:
    radial-gradient(circle at 50% 40%, #151515 0%, #080808 55%, #050505 100%);
}

.product-info {
  padding: 15px;
  border-top: 1px solid #222;
}

.product-name {
  font-size: 12px;
  letter-spacing: 2px;
}

.product-price {
  color: #777;
  font-size: 11px;
  margin-top: 7px;
}

.status {
  position: absolute;
  top: 12px;
  left: 12px;
  font-size: 8px;
  letter-spacing: 2px;
  color: #666;
}

footer {
  border-top: 1px solid #222;
  padding: 30px 24px;
  color: #444;
  font-size: 9px;
  letter-spacing: 3px;
}

@media (max-width: 600px) {
  .products {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">OBLIX</div>
  <a class="back" href="index.html">← ARCHIVE</a>
</header>

<section class="hero">
  <div class="archive-number">ARCHIVE 001</div>
  <h1>T-SHIRTS</h1>
  <div class="subtitle">SEALED / UNKNOWN / 2026</div>
</section>

<section class="products">

  <div class="product">
    <div class="status">001 / CLASSIFIED</div>
    <div class="product-image">PRODUCT IMAGE</div>
    <div class="product-info">
      <div class="product-name">OBLIX TEE 001</div>
      <div class="product-price">€ —</div>
    </div>
  </div>

  <div class="product">
    <div class="status">002 / CLASSIFIED</div>
    <div class="product-image">PRODUCT IMAGE</div>
    <div class="product-info">
      <div class="product-name">OBLIX TEE 002</div>
      <div class="product-price">€ —</div>
    </div>
  </div>

  <div class="product">
    <div class="status">003 / RESTRICTED</div>
    <div class="product-image">PRODUCT IMAGE</div>
    <div class="product-info">
      <div class="product-name">OBLIX TEE 003</div>
      <div class="product-price">€ —</div>
    </div>
  </div>

  <div class="product">
    <div class="status">004 / UNKNOWN</div>
    <div class="product-image">PRODUCT IMAGE</div>
    <div class="product-info">
      <div class="product-name">OBLIX TEE 004</div>
      <div class="product-price">€ —</div>
    </div>
  </div>

</section>

<footer>
  OBLIX / T-SHIRTS / ARCHIVE 2026
</footer>

</body>
</html>
